<html>
  <head>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
      }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';      

      var renderer, controls, scene, camera;
      var toruses = [];

      var flicker = false;
      var wireframe = false;

      var counter = {
        faces: 0,
        edges: 0,
        vertices: 0
      }

      window.onload = function() {

        // Three.js code goes here
        scene = new THREE.Scene();

        // setup the camera
        var fov = 75;
        var ratio = window.innerWidth / window.innerHeight;
        var zNear = 1;
        var zFar = 10000;
        camera = new THREE.PerspectiveCamera( fov, ratio, zNear, zFar );
        camera.position.set(0, 0, 100);

        // create renderer and setup the canvas
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );

        let currMesh;

        renderer.domElement.onmouseup = (e) => {
            controls.enabled = true
        } 

        renderer.domElement.onmousedown = function( e ){

            if (!e.shiftKey) { // if shift key is not pressed
                return
            }
            
            controls.enabled = false

            console.log('Yay! We clicked!');
            var pixel_coords = new THREE.Vector2( e.clientX, e.clientY );
            console.log('Pixel coords', pixel_coords);

            var vp_coords = new THREE.Vector2( 
                        ( pixel_coords.x / window.innerWidth ) * 2 - 1,  //X
                        -( pixel_coords.y / window.innerHeight ) * 2 + 1) // Y

            console.log('Viewport coords', vp_coords);

            var vp_coords_near = new THREE.Vector3( vp_coords.x, vp_coords.y, 0);


            var raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(vp_coords_near, camera);
            var intersects = raycaster.intersectObject(invisible_plane);

            console.log('Ray to Invisible Plane', intersects[0].point);

            var torusGeometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);

            counter.faces += torusGeometry.index.count / 3;
            counter.faces += torusGeometry.index.count;
            counter.faces += torusGeometry.index.count / 2;

            var torusMaterial = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
            var torusKnot = new THREE.Mesh(torusGeometry, torusMaterial);
            scene.add(torusKnot)
            toruses.push(torusKnot)

            currMesh = torusKnot

            torusKnot.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
        };


        var color;
        renderer.domElement.onmousemove = (e) => {
            if (controls.enabled) {
                return
            }

            let { movementX, movementY } = e;

            color = currMesh.scale.x < 0 ? 0xff69b4 : 0x7CFC00;
            
            currMesh.material.color.set(color)
            currMesh.scale.set(currMesh.scale.x + movementY / 2, currMesh.scale.y + movementY / 2, currMesh.scale.z + movementY / 2)
        }

        // setup lights
        var ambientLight = new THREE.AmbientLight();
        scene.add( ambientLight );

        var light = new THREE.DirectionalLight( 0xffffff, 5.0 );
        light.position.set( 10, 100, 10 );
        scene.add( light );

        //
        // The invisible plane
        //
        var planeGeometry = new THREE.PlaneGeometry( 10000, 10000 );
        var planeMaterial = new THREE.MeshBasicMaterial( {
          visible: false
        });

        var invisible_plane = new THREE.Mesh( planeGeometry, planeMaterial );

        scene.add( invisible_plane );
        controls = new OrbitControls( camera, renderer.domElement );
        // call animation/rendering loop
        animate();
        
      };

      window.onkeypress = (e) => {
        if (e.keyCode == 102) {
            flicker = !flicker
        } else if (e.keyCode == 119) {
            wireframe = !wireframe
        } 
      }

      function animate() {
        for (let torus of toruses) {
            if (flicker) {
                torus.material.opacity = Math.random();
                torus.material.transparent = true;
                torus.material.needsUpdate = true;
            } else {
                torus.material.opacity = 1.0;
            }

            torus.material.wireframe = wireframe;
        }

        requestAnimationFrame( animate );

        // and here..
        controls.update();
        renderer.render( scene, camera );
        
        console.log(counter);
        
      };
    </script>
  </head>
  <body></body>
</html>
